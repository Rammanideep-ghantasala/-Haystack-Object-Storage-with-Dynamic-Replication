name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate services
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DIRECTORY_SERVICE: "directory1:7001,directory2:7002,directory3:7003"
      REDIS_NODES: "redis1:6379,redis2:6379,redis3:6379,redis4:6379,redis5:6379,redis6:6379"
      CACHE_NODE_ID: "cache-ci"
      SELF_ADDRESS: "cache-ci:7201"
      NODE_NAME: "store-ci"
      PORT: "9000"
      DATA_PATH: "/tmp/store-import-data"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            webserver/requirements.txt
            directory-service/requirements.txt
            store-service/requirements.txt
            cache-service/requirements.txt
            replication-manager/requirements.txt
            requirements-dev.txt

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          for req in \
            webserver/requirements.txt \
            directory-service/requirements.txt \
            store-service/requirements.txt \
            cache-service/requirements.txt \
            replication-manager/requirements.txt
          do
            python -m pip install -r "$req"
          done
          python -m pip install -r requirements-dev.txt

      - name: Compile service Python files
        run: |
          python -m compileall -q \
            webserver/app \
            directory-service/app \
            store-service/app \
            cache-service/app \
            replication-manager/app \
            scripts

      - name: Import service modules
        run: |
          for app in \
            webserver/app \
            directory-service/app \
            store-service/app \
            cache-service/app \
            replication-manager/app
          do
            python scripts/ci_import_check.py "$app"
          done

      - name: Run pytest
        run: python -m pytest

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
